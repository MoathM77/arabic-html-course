<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعلم CSS - الدرس الأول</title>
    <style>
/* ====================================
   🌐 الخطوط والخلفيات
   ==================================== */

/* 🔹 لون خلفية الصفحة */
body {
    background-color: #f9f9f9;  /* رمادي فاتح */
    font-family: Arial, sans-serif;  /* خط Arial */
}

/* 🔹 لون خلفية العناوين */
h1 {
    background-color: #2c3e50;  /* أزرق داكن */
    color: white;  /* لون النص */
}

h2 {
    background-color: #34495e;  /* أزرق متوسط */
    color: white;
}

/* 🔹 لون خلفية الفقرات */
p {
    background-color: #ffffff;  /* أبيض */
    color: #333333;  /* رمادي غامق */
}

/* 🔹 تنسيق الأكواد (code) */
code {
    background-color: #ecf0f1;  /* رمادي فاتح جداً */
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
}

/* 🔹 تنسيق الجداول */
table {
    width: 100%;
    border-collapse: collapse;
    background-color: white;
}

th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: right;
}

th {
    background-color: #f2f2f2;
}

/* 🔹 تنسيق الأزرار */
button {
    background-color: #3498db;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #2980b9;
}

/* 🔹 روابط */
a {
    color: #3498db;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}
    </style>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>📘 تعلم CSS</h1>
    <p>هذا أول درس في CSS، نتعلم كيف نغيّر الألوان والخطوط.</p>
    <p>اللون الأزرق للعنوان، والخلفية فاتحة.</p>
</body>
</html>
